.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6em;background:rgba(20,8,45,.82);text-align:center;padding:1em;overflow:auto}
.hidden{display:none!important}
h1{margin:0;font-size:3em;color:#ffd84a;text-shadow:0 .08em 0 #8a3b00,0 0 .6em #ff9a2e}

.sub{font-size:1.2em;color:#ffb8e0;margin-bottom:.3em}
button{font:inherit;font-size:1em;padding:.45em 1em;border-radius:.6em;border:.15em solid #ffd84a;background:#5b2d8e;color:#fff;cursor:pointer}
button:hover:not(:disabled){background:#7b3fc0}
button:disabled{opacity:.45;cursor:not-allowed}
button.on{background:#c0507a}
.row{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center}
#stageList{display:grid;grid-template-columns:repeat(5,1fr);gap:.5em;width:92%}
#stageList button{padding:.7em .3em;font-size:.95em}
.note{font-size:.75em;opacity:.7;max-width:90%}
#almGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(11em,1fr));gap:.7em;width:96%;overflow:auto;max-height:76%;padding:.3em}
.card{background:#2c1650;border:.12em solid #8d62d0;border-radius:.7em;padding:.5em;font-size:.8em;text-align:left}
.card canvas{width:100%;height:auto;aspect-ratio:5/6;display:block;background:radial-gradient(#5d3b94,#27134a);border-radius:.5em;object-fit:contain}
.card b{font-size:1.15em;color:#ffd84a}
.card .st{color:#9fe;font-size:.9em}
</style>
</head>

 R(W-86,10,76,30,8,'#4a3320','#c9a064',2);g.fillStyle='#fff';g.font='bold 16px Arial';g.textAlign='center';g.fillText('⏸ P',W-48,31);
 g.fillStyle='#ffe9b0';g.font='bold 15px sans-serif';g.textAlign='right';g.fillText(`${t('stg')} ${G.i+1} · ${t('s'+(G.i+1))}`,W-100,28);
 const bs=G.zs.find(z=>z.boss&&z.state!=='dying');
 if(bs){const w=250,x=W-w-100;g.fillStyle='#fff';g.font='bold 13px sans-serif';g.textAlign='left';g.fillText(t(bs.type)+(bs.type==='mom'?'  ♥'.repeat(bs.lives):''),x,60);
  g.fillStyle='rgba(0,0,0,.6)';g.fillRect(x,66,w,12);g.fillStyle='#e03a3a';g.fillRect(x,66,w*Math.max(0,bs.hp/bs.maxhp),12);g.strokeStyle='#fff';g.strokeRect(x,66,w,12)}
 // wave bar
 const bx=330,bw=320,by=558;g.fillStyle='rgba(0,0,0,.5)';g.fillRect(bx,by,bw,14);g.fillStyle='#9c4';g.fillRect(bx,by,bw*G.prog,14);g.strokeStyle='#fff';g.strokeRect(bx,by,bw,14);
 g.fillStyle='#fff';g.font='bold 12px sans-serif';g.textAlign='center';g.fillText(`${t('wave')} ${G.wave}/${G.st.waves}`,bx+bw/2,by+11);
 const mid=Math.floor(G.st.waves/2);for(const w of[mid,G.st.waves]){const fx=bx+bw*w/G.st.waves-(w===G.st.waves?4:0);L(fx,by-1,fx,by-9,'#f44',2);P([fx,by-9,fx+8,by-6,fx,by-3],'#f44')}
}
function drawScene(){
 g.drawImage(G.bg,0,0);
 const st=G.st;
 for(const r of st.water){g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=2;for(let i=0;i<14;i++){const x=X0+((i*71+G.t*14)%(COLS*CW)),y=Y0+r*G.ch+10+(i*37%(G.ch-20));g.beginPath();g.arc(x,y,7,3.6,5.8);g.stroke()}}
 if(G.hover&&G.sel){const {r,c}=G.hover;let ok=true;const cell=G.cells[r][c];
  if(G.sel==='shovel')ok=!!(cell.unit||cell.base);else if(G.sel==='base')ok=needBase(r)&&!cell.base;else ok=!cell.unit&&(!needBase(r)||!!cell.base);
  g.fillStyle=ok?'rgba(255,255,255,.28)':'rgba(255,0,0,.25)';g.fillRect(X0+c*CW,Y0+r*G.ch,CW,G.ch)}
 for(let r=0;r<st.rows;r++){
  drawMower(G.mowers[r]);
  for(let c=0;c<COLS;c++){const cell=G.cells[r][c];if(cell.base)drawBase(X0+c*CW+CW/2,rowY(r)+G.ch*.38,1,st.roof,cell.base.hp/cell.base.max*.5+.5);if(cell.unit)drawUnit(cell.unit)}
  for(const z of G.zs)if(z.row===r)drawZ(z);
  for(const p of G.projs)if(p.row===r){const y=rowY(r)-G.ch*.05;
   if(p.k==='tail'){g.save();g.translate(p.x,y);g.rotate(p.a);g.scale(.7,.7);E(0,0,19,11,'#8d4f2c','#5d3019',2);g.restore()}
   else if(p.k==='ztail'){g.save();CORR=true;g.translate(p.x,y);g.rotate(-p.a);g.scale(.7,.7);E(0,0,19,11,'#8d4f2c','#5d3019',2);CORR=false;g.restore()}
   else{g.save();g.translate(p.x,y);g.rotate(-p.a);g.scale(.55,.55);kHead(0,0,{});g.restore()}}
 }
 if(G.hover&&G.sel&&G.sel!=='shovel'){const {r,c}=G.hover;g.save();g.globalAlpha=.5;
  if(G.sel==='base')drawBase(X0+c*CW+CW/2,rowY(r)+G.ch*.38,1,st.roof);else drawChar(G.sel,X0+c*CW+CW/2,rowY(r)+G.ch*.38,G.ch/118,gt,{});g.restore()}
 if(st.fog)drawFog();
 for(const f of G.fx){const k=1-f.t/f.d;if(f.k==='ring'){g.globalAlpha=1-k;E(f.x,f.y,f.R*k,f.R*k*.7,'rgba(255,255,255,.08)',f.col,4);g.globalAlpha=1}
  else if(f.k==='txt'){g.globalAlpha=Math.min(1,f.t*2);g.fillStyle=f.col;g.strokeStyle='#000';g.lineWidth=4;g.font='bold 26px sans-serif';g.textAlign='center';g.strokeText(f.txt,f.x,f.y-k*30);g.fillText(f.txt,f.x,f.y-k*30);g.globalAlpha=1}}
 for(const p of G.pf){g.globalAlpha=p.mode==='rest'&&p.life<2?p.life/2:1;const bob=p.mode==='rest'?Math.sin(gt*5+p.x)*2:0;drawPuff(p.x,p.y+bob,p.gold?20:16,p.gold);g.globalAlpha=1}
 drawHUD();
 if(G.msg){g.globalAlpha=Math.min(1,G.msg.t*2);g.fillStyle='#ff6a6a';g.strokeStyle='#000';g.lineWidth=4;g.font='bold 22px sans-serif';g.textAlign='center';g.strokeText(G.msg.txt,W/2,126);g.fillText(G.msg.txt,W/2,126);g.globalAlpha=1}
 if(G.banner){const b=G.banner;g.globalAlpha=Math.min(1,b.t,3-b.t+.5);g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,250,W,80);g.fillStyle=b.col;g.strokeStyle='#000';g.lineWidth=6;g.font='bold 44px sans-serif';g.textAlign='center';g.strokeText(b.txt,W/2,305);g.fillText(b.txt,W/2,305);g.globalAlpha=1}
}
function drawMenuBG(){
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#7fc8ef');gr.addColorStop(.55,'#bfe8ff');gr.addColorStop(.55,'#6dbb4e');gr.addColorStop(1,'#3f8a33');g.fillStyle=gr;g.fillRect(0,0,W,H);
 const row=['dingyi','godjj','abao','cg1'];row.forEach((k,i)=>drawChar(k,170+i*150,500,1.5,gt+i,{a:0}));
 ['dakai','headless','legs','hands','mom'].forEach((k,i)=>{const x=W-((gt*35+i*230)%(W+300))+60;drawChar(k,x,360+(i%2)*50,1.1,gt,{flip:true,ph:gt*4+i,hasHead:true})});
}

/* =====================================================================
   INPUT
   ===================================================================== */
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function cellAt(p){if(p.x<X0||p.x>=X0+COLS*CW||p.y<Y0||p.y>=Y0+450)return null;return{c:Math.floor((p.x-X0)/CW),r:Math.floor((p.y-Y0)/G.ch)}}
cv.addEventListener('pointermove',e=>{if(state!=='play')return;G.hover=cellAt(pos(e))});
cv.addEventListener('contextmenu',e=>{e.preventDefault();if(G)G.sel=null});
cv.addEventListener('pointerdown',e=>{
 if(state!=='play')return;const p=pos(e);sfx(1,.01,'sine',0);
 if(p.x>W-86&&p.y<42){setPause(true);return}
 for(let i=G.pf.length-1;i>=0;i--){const q=G.pf[i];if(q.mode!=='fly'&&Math.hypot(q.x-p.x,q.y-p.y)<34){q.mode='fly';sfx(1000,.08,'triangle',.05,400);return}}
 if(p.y<Y0){
  G.cards.forEach((c,i)=>{const x=cardX(i);if(p.x>=x&&p.x<x+74&&p.y<92)selectCard(c.k)});
  const sx=cardX(G.cards.length);if(p.x>=sx&&p.x<sx+56&&p.y<92)G.sel=G.sel==='shovel'?null:'shovel';return}
 const h=cellAt(p);if(!h){G.sel=null;return}
 G.hover=h;const cell=G.cells[h.r][h.c];
 if(G.sel==='shovel'){if(cell.unit)cell.unit=null;else if(cell.base)cell.base=null;sfx(250,.1,'square',.04);G.sel=null}
 else if(G.sel)place(G.sel,h.r,h.c);
});
function selectCard(k){
 const c=G.cards.find(x=>x.k===k);if(!c)return;
 if(G.sel===k){G.sel=null;return}
 if(G.cd[k]>0){msg('cooling');return}if(G.puffs<c.cost){msg('noPuffs');return}G.sel=k}
addEventListener('keydown',e=>{
 if(state==='play'||state==='pause'){
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){if(state==='play'&&G.sel&&e.key==='Escape')G.sel=null;else setPause(state==='play')}
  else if(state==='play'){if(e.key>='1'&&e.key<='9'){const c=G.cards[+e.key-1];if(c)selectCard(c.k)}if(e.key==='s'||e.key==='S')G.sel=G.sel==='shovel'?null:'shovel'}
 }});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')setPause(true)});
function setPause(on){if(on&&state==='play'){state='pause';$('pause').classList.remove('hidden')}else if(!on&&state==='pause'){state='play';$('pause').classList.add('hidden')}}
$('bResume').onclick=()=>setPause(false);$('bRestart').onclick=()=>startStage(G.i);$('bPMenu').onclick=toMenu;

/* =====================================================================
   MENU / ALMANAC / LANGUAGE

function applyLang(){
 document.documentElement.lang=['en','zh-Hant','zh-Hans'][LI];document.title=t('title');
 $('ttl').textContent=t('title');$('ttlSub').textContent=t('titleSub');
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll('#langs button').forEach(b=>b.classList.toggle('on',+b.dataset.l===LI));
 $('bMute').textContent=t(muted?'musicOff':'musicOn');buildMenu();buildAlmanac();
 if(state==='pause'||state==='end'){}
}
function buildMenu(){
 const l=$('stageList');l.innerHTML='';
 for(let i=0;i<5;i++){const b=document.createElement('button');b.disabled=i>=unlocked;b.textContent=(i>=unlocked?'🔒 ':'')+(i+1)+'. '+t('s'+(i+1));b.onclick=()=>startStage(i);l.appendChild(b)}
}
document.querySelectorAll('#langs button').forEach(b=>b.onclick=()=>{LI=+b.dataset.l;localStorage.jgzLang=LI;applyLang()});
$('bMute').onclick=()=>{muted=!muted;localStorage.jgzMute=muted?'1':'0';BGM.setMute(muted);$('bMute').textContent=t(muted?'musicOff':'musicOn')};
$('bAlm').onclick=()=>{$('menu').classList.add('hidden');$('alm').classList.remove('hidden')};
$('bAlmBack').onclick=()=>{$('alm').classList.add('hidden');$('menu').classList.remove('hidden')};
const ALM=[['godjj',1.75],['abao',1.75],['dingyi',1.7],['cg1',1.75],['dakai',1.7],['head',1.7],['headless',1.7],['legs',1.7],['hands',1.7],['mom',1.5],['king',1.25],['cJJ',1.7],['cBao',1.7],['cDing',1.65],['cCG',1.75]];
let almCtx=[];
function buildAlmanac(){
 const gd=$('almGrid');gd.innerHTML='';almCtx=[];
 for(const [k,sc] of ALM){
  const d=document.createElement('div');d.className='card';
  const isD=['godjj','abao','dingyi','cg1'].includes(k);
  const hp=isD?UD[k]:(ZD[k].hp*(ZD[k].lives||1));
  const cost=isD?CARDS.find(c=>c.k===k).cost:null;
  d.innerHTML=`<canvas width="200" height="240"></canvas><b>${t(k)}</b><div class="st">${t('hp')}: ${hp}${cost?` · ${t('cost')}: ${cost}`:''}</div><div>${t(k+'D')}</div>`;
  gd.appendChild(d);almCtx.push({k,sc,isD,c:d.querySelector('canvas').getContext('2d')});
 }
}
function drawAlmanac(){
 const sv=g;for(const a of almCtx){g=a.c;g.clearRect(0,0,200,240);drawChar(a.k,100,228,a.sc,gt,{flip:!a.isD,ph:gt*3,hasHead:true,a:0})}g=sv}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
function fit(){const s=$('stage');s.style.fontSize=(s.clientWidth/980*16)+'px'}
addEventListener('resize',fit);fit();
let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;gt+=dt;
 g=ctx;
 if(state==='play'){update(dt);if(G)drawScene()}
 else if((state==='pause'||state==='end')&&G){if(state==='end'){for(let i=G.fx.length-1;i>=0;i--)if((G.fx[i].t-=dt)<=0)G.fx.splice(i,1)}drawScene()}
 else drawMenuBG();
 if(!$('alm').classList.contains('hidden'))drawAlmanac();
 requestAnimationFrame(loop);
}
applyLang();requestAnimationFrame(loop);
